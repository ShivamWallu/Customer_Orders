version: '3.8'

# ==============================================================================
# Khandelia Oil & General Mills - Production Scale Orchestration Stack
# Designed to absorb 1M to 10M concurrent users and high-volume order flows.
# Components: FastAPI (Gunicorn) + PostgreSQL 16 + PgBouncer + Redis 7 + Nginx
# ==============================================================================

services:
  # 1. FastAPI High-Concurrency Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://kogm_user:KogmSecure2026Password@pgbouncer:6432/kogm_orders
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - WEB_CONCURRENCY=8
      - DB_POOL_SIZE=50
      - DB_MAX_OVERFLOW=100
    depends_on:
      - pgbouncer
      - redis
    volumes:
      - order_slips_data:/app/order_slips
      - images_data:/app/images
    networks:
      - kogm_internal_net
    expose:
      - "8000"

  # 2. PgBouncer Connection Pooler (Prevents PostgreSQL connection exhaustion)
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    restart: always
    environment:
      - DB_USER=kogm_user
      - DB_PASSWORD=KogmSecure2026Password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kogm_orders
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=100
      - MIN_POOL_SIZE=20
      - RESERVE_POOL_SIZE=10
      - MAX_DB_CONNECTIONS=200
    depends_on:
      - db
    networks:
      - kogm_internal_net
    expose:
      - "6432"

  # 3. Enterprise PostgreSQL 16 Primary Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=kogm_user
      - POSTGRES_PASSWORD=KogmSecure2026Password
      - POSTGRES_DB=kogm_orders
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=32MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - kogm_internal_net
    expose:
      - "5432"

  # 4. Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - kogm_internal_net
    expose:
      - "6379"

  # 5. Nginx High-Concurrency Reverse Proxy & Static Asset Accelerator
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - images_data:/app/images:ro
      - order_slips_data:/app/order_slips:ro
    depends_on:
      - web
    networks:
      - kogm_internal_net

networks:
  kogm_internal_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  order_slips_data:
  images_data:
